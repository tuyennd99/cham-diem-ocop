packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.44'
  - '@tanstack/router-core@1.171.37'
  - '@tanstack/router-generator@1.167.43'
  - '@tanstack/router-plugin@1.168.45'
