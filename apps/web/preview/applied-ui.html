<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Giao diện ứng dụng · OCOP Đánh Giá</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="preview.css">
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { min-width: 320px; margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 var(--font-body); }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.frame { width: min(1040px, calc(100% - 40px)); margin: 0 auto; padding: 30px 0 64px; }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
.topline a { min-height: 44px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; }
.eyebrow { margin: 0 0 8px; color: var(--accent); font: 600 11px/1.5 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }
h1 { margin: 30px 0 8px; font-size: clamp(32px, 5vw, 48px); line-height: 1.15; }
h2 { margin: 0 0 12px; font-size: 24px; line-height: 1.25; }
h3 { margin: 0 0 8px; font-size: 19px; line-height: 1.35; }
p { margin: 0; }
.intro { max-width: 66ch; margin-bottom: 28px; color: var(--muted); }
.stack { display: grid; gap: 24px; }
.panel { padding: 24px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 16px; }
.token-card, .asset { min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
.token-chip { min-height: 82px; border-bottom: 1px solid var(--border); }
.token-copy { padding: 12px 14px; }
.token-copy strong, .token-copy code { display: block; }
.token-copy code, .mono { font-family: var(--font-mono); font-size: 13px; }
.button { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--fg); font: 600 14px/1.3 var(--font-body); cursor: pointer; }
.button-primary { border-color: var(--accent); background: var(--accent); color: var(--surface); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field input, .field select { min-height: 46px; width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--fg); font: inherit; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { display: inline-flex; min-height: 26px; align-items: center; padding: 4px 9px; border-radius: 999px; background: var(--surface-soft); color: var(--fg); font-size: 12px; font-weight: 600; }
.asset img { display: block; width: auto; max-width: 100%; height: auto; max-height: 340px; margin: auto; object-fit: contain; }
.asset figcaption { padding: 12px 14px; border-top: 1px solid var(--border); font-size: 13px; }
.record { display: grid; grid-template-columns: 150px minmax(0, 1fr) 150px; align-items: center; gap: 20px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
.record img { width: 100%; height: auto; max-height: 190px; object-fit: contain; }
iframe { display: block; width: 100%; height: min(80vh, 900px); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
@media (max-width: 680px) { .frame { width: calc(100% - 32px); padding-top: 20px; } .panel { padding: 18px; } .record { grid-template-columns: 92px minmax(0, 1fr); align-items: start; gap: 12px; } .record-result { grid-column: 2; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
</style>
</head>
<body><main class="frame" data-od-id="applied-ui-preview"><div class="topline"><span class="eyebrow">OCOP ĐÁNH GIÁ · DESIGN SYSTEM</span><a href="index.html">Tất cả preview</a></div><h1 data-od-id="applied-ui-heading">Giao diện ứng dụng</h1><p class="intro">Bản ghép tương tác từ bộ kit: tra cứu hồ sơ, lọc trạng thái và danh mục, mở chi tiết, rồi xem luồng minh họa cho chủ thể sản phẩm.</p><iframe src="../ui_kits/app/index.html" title="Giao diện tra cứu hồ sơ OCOP tương tác" data-od-id="applied-ui-frame"></iframe><p class="note" style="margin-top:16px">Các hồ sơ, tài khoản và thao tác nộp hồ sơ là dữ liệu minh họa; chúng không được gửi hoặc lưu.</p></main></body></html>
