services:
  postgres-db:
    image: docker.io/library/postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    mem_limit: 1g
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /srv/storage/postgres/data:/var/lib/postgresql/data
      - /srv/storage/postgres-backup:/backup:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
